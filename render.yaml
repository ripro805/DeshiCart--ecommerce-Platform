# Render Blueprint - declarative infra.
# Apply from Render Dashboard: New -> Blueprint -> point at this repo.
# Generates: PostgreSQL + Django Web Service + Next.js Web Service.
services:
  - type: pserv
    name: deshicart-db
    plan: free
    region: oregon
    # Render's free Postgres is on the way out (legacy free tier).
    # Use the lowest "Starter" plan when free is unavailable in your account.
    databaseName: deshicart
    databaseUser: deshicart
    ipAllowList: []

  - type: web
    name: deshicart-api
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: "./build.sh"
    startCommand: "gunicorn deshicart.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --access-logfile - --error-logfile -"
    healthCheckPath: "/api/health/"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true   # Render generates and stores this; reference via ${DJANGO_SECRET_KEY}
      - key: DJANGO_ALLOWED_HOSTS
        value: "deshicart-api.onrender.com"
      - key: USE_NEON
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: deshicart-db
          property: connectionString
      - key: SSLCOMMERZ_STORE_ID
        sync: false          # set in Dashboard -> Environment
      - key: SSLCOMMERZ_STORE_PASSWD
        sync: false
      - key: SSLCOMMERZ_IS_SANDBOX
        value: "false"
      - key: SSLCOMMERZ_BACKEND_URL
        value: "https://deshicart-api.onrender.com"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: FRONTEND_DOMAIN
        value: deshicart-web.onrender.com
      - key: FRONTEND_PROTOCOL
        value: https
      - key: SSLCOMMERZ_SUCCESS_URL
        value: https://deshicart-web.onrender.com/checkout/success
      - key: SSLCOMMERZ_CANCEL_URL
        value: https://deshicart-web.onrender.com/checkout/cancel
      - key: SSLCOMMERZ_FAIL_URL
        value: https://deshicart-web.onrender.com/checkout/fail
      - key: SSLCOMMERZ_IPN_URL
        value: https://deshicart-api.onrender.com/api/orders/sslcommerz/ipn/
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    name: deshicart-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://deshicart-api.onrender.com"
      - key: NEXT_PUBLIC_GOOGLE_OAUTH_URL
        value: ""
      - key: NODE_VERSION
        value: "20.18.0"
