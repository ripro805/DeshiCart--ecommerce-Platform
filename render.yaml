# Render Blueprint - declarative infra.
# Apply from Render Dashboard: New -> Blueprint -> point at this repo.
# Generates: Django Web Service + Next.js Web Service.
# Database: external Neon PostgreSQL. Paste DATABASE_URL in Render Dashboard.
services:
  - type: web
    name: deshicart-api
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: "./build.sh"
    startCommand: "gunicorn deshicart.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --access-logfile - --error-logfile -"
    healthCheckPath: "/api/health/"
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true   # Render generates and stores this; reference via ${DJANGO_SECRET_KEY}
      - key: DJANGO_ALLOWED_HOSTS
        value: "deshicart-ecommerce-platform.onrender.com"
      - key: USE_NEON
        value: "true"
      - key: DATABASE_URL
        sync: false
        # Paste Neon connection string here in Render Dashboard -> Environment:
        # postgresql://neondb_owner:<pwd>@ep-nameless-snow-a6e31yvx-pooler.us-west-2.aws.neon.tech/neondb?sslmode=require
      - key: SSLCOMMERZ_STORE_ID
        sync: false          # set in Dashboard -> Environment
      - key: SSLCOMMERZ_STORE_PASSWD
        sync: false
      - key: SSLCOMMERZ_IS_SANDBOX
        value: "false"
      - key: SSLCOMMERZ_BACKEND_URL
        value: "https://deshicart-ecommerce-platform.onrender.com"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: FRONTEND_DOMAIN
        value: deshicart-ecommerce-platform.onrender.com
      - key: FRONTEND_PROTOCOL
        value: https
      - key: SSLCOMMERZ_SUCCESS_URL
        value: https://deshicart-ecommerce-platform.onrender.com/checkout/success
      - key: SSLCOMMERZ_CANCEL_URL
        value: https://deshicart-ecommerce-platform.onrender.com/checkout/cancel
      - key: SSLCOMMERZ_FAIL_URL
        value: https://deshicart-ecommerce-platform.onrender.com/checkout/fail
      - key: SSLCOMMERZ_IPN_URL
        value: https://deshicart-ecommerce-platform.onrender.com/api/orders/sslcommerz/ipn/
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    name: deshicart-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm run start -- -p $PORT -H 0.0.0.0"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: ""
      - key: NEXT_PUBLIC_GOOGLE_OAUTH_URL
        value: ""
      - key: NODE_VERSION
        value: "20.18.0"
